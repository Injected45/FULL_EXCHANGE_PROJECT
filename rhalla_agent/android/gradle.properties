# ذاكرة عفريت Gradle.
#
# القيم الافتراضية التي يضعها قالب فلاتر (‎-Xmx8G مع ‎MaxMetaspaceSize=4G‎)
# مكتوبة لجهاز ذي ذاكرة أكبر من هذا. الجهاز هنا 8 غيغابايت إجمالاً، فطلبُ
# كومةٍ بحجم الذاكرة كلها ينهار: JVM يحجز فضاءً افتراضياً لـ G1 قبل أن
# يبدأ العمل، فيفشل الحجز ويختفي العفريت في منتصف assembleRelease برسالة
# «Gradle build daemon disappeared unexpectedly» التي لا تذكر الذاكرة.
#
# 3 غيغا تكفي R8 وتقلّص الموارد على هذا المشروع، وتترك للنظام وللمحاكي
# ما يكفي كي لا يتنافسا على نفس الذاكرة أثناء البناء.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
