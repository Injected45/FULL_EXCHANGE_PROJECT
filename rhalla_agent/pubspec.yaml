name: rhalla_agent
description: "تطبيق الوكيل - شركة الرحالة للحوالات المالية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والتوجيه
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # الشبكة
  dio: ^5.7.0

  # التخزين — الرمز ومعرّف الجهاز يجب أن يكونا في التخزين الآمن لا SharedPreferences
  flutter_secure_storage: ^9.2.2

  # الجهاز
  device_info_plus: ^11.2.0

  # العرض — الخطوط مضمَّنة في assets/fonts، لا google_fonts:
  # الوكيل قد يعمل بلا اتصال، والجلب وقت التشغيل يعني ومضة بخط بديل.
  flutter_svg: ^2.0.16
  intl: ^0.20.2
  share_plus: ^12.0.2
  printing: ^5.14.3
  pdf: ^3.12.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

  fonts:
    # ملف متغيّر واحد بمحور wght — انظر T.kufi في core/theme/app_theme.dart
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
