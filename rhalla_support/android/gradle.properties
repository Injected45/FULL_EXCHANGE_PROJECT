# -Xmx8G من القالب لا يناسب هذا الجهاز (8 GB): تفشل الـ JVM في حجز
# مساحة G1 وسط البناء، والرسالة تقول فقط "Gradle build daemon disappeared"
# ولا تذكر الذاكرة إطلاقاً. وهو ما أسقط بناء تطبيق الوكيل من قبل.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
